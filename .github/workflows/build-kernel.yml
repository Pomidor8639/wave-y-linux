name: Build Wave Y Linux Kernel

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build Kernel inside Ubuntu 18.04 Container
      run: |
        chmod +x build.sh
        docker run --rm -v $GITHUB_WORKSPACE:/work -w /work ubuntu:18.04 bash /work/build.sh

    - name: Upload Kernel Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: wave-y-linux-build
        path: output/

